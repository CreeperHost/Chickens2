plugins { id 'multiloader-common'; id 'net.neoforged.moddev' }
neoForge { neoFormVersion = neo_form_version; accessTransformers.from(file('src/main/resources/META-INF/accesstransformer.cfg')) }
dependencies {
    compileOnly 'maven.modrinth:jade:26.3.5+fabric'
    compileOnly 'org.spongepowered:mixin:0.8.5'
    compileOnly "net.creeperhost.polylib:polylib-fabric:${polylib_version}"
    compileOnly "net.fabricmc:fabric-loader:${fabric_loader_version}"
    compileOnly "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}
configurations {
    commonJava { canBeResolved = false; canBeConsumed = true }
    commonResources { canBeResolved = false; canBeConsumed = true }
}
artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}
sourceSets.main.resources { srcDir 'src/generated/resources' }
