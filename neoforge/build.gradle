plugins { id 'multiloader-loader'; id 'net.neoforged.moddev' }
neoForge {
    version = neoforge_version
    accessTransformers.from(project(':common').file('src/main/resources/META-INF/accesstransformer.cfg'))
    runs { client { client(); jvmArgument '-XX:StackShadowPages=32' }; server { server() } }
    mods { chickens { sourceSet sourceSets.main } }
}
dependencies { compileOnly 'maven.modrinth:jade:26.3.5+neoforge'; implementation "net.creeperhost.polylib:polylib-neoforge:${polylib_version}" }
