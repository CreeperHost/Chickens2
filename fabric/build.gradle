plugins { id 'multiloader-loader'; id 'net.fabricmc.fabric-loom' }
dependencies {
    compileOnly 'maven.modrinth:jade:26.3.5+fabric'
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation "net.creeperhost.polylib:polylib-fabric:${polylib_version}"
    implementation 'teamreborn:energy:5.0.0'
}
loom {
    accessWidenerPath = project(':common').file('src/main/resources/chickens.accesswidener')
    runs { client { client(); vmArg '-XX:StackShadowPages=32' }; server { server() } }
}

sourceSets.main.java.exclude 'net/creeperhost/chickens/fabric/datagen/**'
