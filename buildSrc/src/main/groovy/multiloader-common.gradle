plugins { id 'java-library'; id 'maven-publish' }
base { archivesName = "chickens-${project.name}-${minecraft_version}" }
java { toolchain.languageVersion = JavaLanguageVersion.of(25); withSourcesJar() }
repositories {
    mavenCentral()
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://maven.creeperhost.net' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public' }
    maven { url = 'https://www.cursemaven.com' }
    maven { url = 'https://maven.fabricmc.net' }
}
processResources {
    inputs.property 'version', project.version
    filesMatching(['fabric.mod.json', 'META-INF/neoforge.mods.toml']) { expand version: project.version }
}

tasks.withType(JavaCompile).configureEach { options.compilerArgs.addAll(['-Xmaxerrs', '1000']) }
